name: CI - MLOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov mlflow scikit-learn pandas numpy joblib
    
    - name: Train model (required for tests)
      run: |
        echo "📊 Training model for tests..."
        MLFLOW_ALLOW_FILE_STORE=true python src/train.py
      env:
        MLFLOW_ALLOW_FILE_STORE: true
    
    - name: Run tests
      run: |
        pytest tests/ -v
      env:
        MLFLOW_ALLOW_FILE_STORE: true
